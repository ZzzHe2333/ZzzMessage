name: Publish ZzzMessage Release (explicit request)
on:
  workflow_dispatch:
  push:
    branches:
      - 'release-request/2026-10-15-v0.3.0-beta.1'
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.3.0-beta.1
      BUILD_RUN_ID: "38693679907"
      TARGET_COMMIT: "b5e17a694186ce3a7133ef436addd71b4b28e898"
    steps:
      - uses: actions/checkout@v4
      - name: Download previously compiled and tested packages
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh run download "$BUILD_RUN_ID" --repo "$GH_REPO" --name "ZzzMessage-cross-platform-packages" --dir release-files
          cd release-files
          sha256sum -c SHA256SUMS.txt
          test -f ZzzMessage-Windows-amd64.zip
          test -f ZzzMessage-Linux-amd64.tar.gz
          test -f ZzzMessage-Linux-arm64.tar.gz
          test -f ZzzMessage-Web-static.zip
          test -f ZzzMessage-iPhone-PWA.zip
          test -f ZzzMessage-Docker-source.tar.gz
      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          ZzzMessage v0.3.0-beta.1 跨平台预发布版本（2026-10-15）。
          
          ### 本次新增
          - 离线消息正文临时持久化，重连补发。客户端写入 IndexedDB 后回 ACK 删除该账号的待投递副本；每账号队列最多 500 条、14 天补发期。
          - 同账号多设备之间的本地聊天历史同步：旧设备在线时，经 Go WebSocket 分片中继，另一台设备存入本机 IndexedDB；服务器不提供永久云端全量历史。
          - 新增 /login、/message、/friend、/setting、/gift、/money 六个独立浏览器路径，支持通过同一反向代理访问和刷新。
          - 新增 /gift 虚拟礼物商城与 /money 三币种钱包，礼物交易账本持久化，重复购买请求不会重复扣币。
          - 每日首次登录自动抽取 1 枚虚拟货币：金币 1%、银币 9%、铜币 90%；UTC 每个账号每日一次。
          - 私有网段浏览器来源 CIDR 配置，Windows BAT 局域网启动脚本和可选端口，支持 DDNSTO HTTPS 域名白名单。
          
          ### 发行文件
          - ZzzMessage-Windows-amd64.zip：Windows x64 Go EXE + Web + start.bat / start-lan.bat / start.ps1。
          - ZzzMessage-Linux-amd64.tar.gz 与 ZzzMessage-Linux-arm64.tar.gz：Linux Go 可执行程序 + Web + start.sh。
          - ZzzMessage-Web-static.zip：网页前端静态文件。
          - ZzzMessage-iPhone-PWA.zip：iPhone PWA 前端静态文件，通知要求安全 HTTPS。
          - ZzzMessage-Docker-source.tar.gz：需要自行执行 docker compose build 的源码，不是预构建镜像。
          - SHA256SUMS.txt：发行包 SHA-256 校验文件。
          
          ### 安装
          解压对应平台的发行文件，复制 .env.example 到 .env，填写至少 12 位邀请码 INVITE_CODE 和至少 32 位的 SESSION_SECRET。
          Windows 双击 start.bat 仅本机访问；局域网使用 start-lan.bat（可在命令行传入 43555 端口）。DDNSTO 必须把对应 HTTPS 域名加入 ALLOWED_ORIGINS。Windows 防火墙仍需配置允许的私有网段。
          详细配置见 docs/RELEASE.md、docs/OFFLINE_AND_ROUTES.md、docs/HISTORY_AND_ECONOMY.md。
          
          ### 重要限制
          - beta 测试版本，未经过公网生产安全审计；聊天不是端到端加密。服务器的待投递消息正文会明文保存在磁盘上，浏览器 IndexedDB 也未加密。
          - 多设备全量历史同步要求至少一台存有历史的旧设备在线；所有旧设备离线或本地历史丢失时，无法通过服务器永久恢复旧记录。
          - Go 测试、go vet、Web / iPhone PWA 编译、Windows / Linux 交叉编译已经通过 GitHub Actions。
          - 未完成所有真实设备端到端测试；Android APK、HarmonyOS 客户端不包含在本次发行包中；厂商系统推送仍需厂商 SDK 和资质。
          - 站内金币、银币、铜币仅为虚拟积分，不可充值、提现或兑换现实货币。
          
          ### 源码及构建
          - [成功的构建流程](https://github.com/ZzzHe2333/ZzzMessage/actions/runs/38693679907)，构建提交 a49bb1fea6010c5d547b42f5c0c0dddb98fba0fd。
          - Tag 指向主分支提交 b5e17a694186ce3a7133ef436addd71b4b28e898，代码与构建分支一致，仅构建触发工作流不同。
          
          NOTES
      - name: Publish GitHub prerelease with all assets
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "ZzzMessage v0.3.0-beta.1 · 离线同步 / 礼物金币 / Windows Linux Docker PWA" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" release-files/ZzzMessage-* release-files/SHA256SUMS.txt \
              --repo "$GH_REPO" \
              --target "$TARGET_COMMIT" \
              --title "ZzzMessage v0.3.0-beta.1 · 离线同步 / 礼物金币 / Windows Linux Docker PWA" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
      - name: Confirm all release assets
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,tagName,isPrerelease,assets
