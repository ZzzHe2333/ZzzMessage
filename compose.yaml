services:
  server:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: :58463
      INVITE_CODE: ${INVITE_CODE:?Please set INVITE_CODE in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Please set SESSION_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Please set ALLOWED_ORIGINS in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      XIAOMI_APP_SECRET: ${XIAOMI_APP_SECRET:-}
      XIAOMI_PACKAGE_NAME: ${XIAOMI_PACKAGE_NAME:-}
      VIVO_APP_ID: ${VIVO_APP_ID:-}
      VIVO_APP_KEY: ${VIVO_APP_KEY:-}
      VIVO_APP_SECRET: ${VIVO_APP_SECRET:-}
    volumes:
      - zzzmessage_data:/data
    networks:
      - private
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-58463}:80"
    depends_on:
      - server
    networks:
      - private
networks:
  private:
volumes:
  zzzmessage_data:
